<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>CF7 Form Detector</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="../../icons/icon32.png" alt="" width="24" height="24">
      <div class="brand-text">
        <h1>CF7 Form Detector</h1>
        <p id="page-host">&nbsp;</p>
      </div>
    </div>
    <button id="settings-btn" class="icon-btn" type="button" title="Options" aria-label="Open options">&#9881;</button>
  </header>

  <section class="card status-card" aria-live="polite">
    <div class="status-top">
      <span id="wp-badge" class="badge" data-kind="neutral">Checking&hellip;</span>
      <span id="bedrock-note" class="status-note"></span>
    </div>
    <div class="admin-row">
      <span class="admin-label">Admin</span>
      <code id="admin-url" class="admin-url">&mdash;</code>
      <button id="copy-admin" class="mini-btn" type="button" title="Copy admin URL">Copy</button>
    </div>
  </section>

  <div id="notice" class="notice" role="status" hidden></div>

  <section class="forms">
    <div class="forms-head">
      <h2>Detected forms <span id="form-count" class="count">0</span></h2>
      <div class="forms-head-actions">
        <button id="prefill-all" class="mini-btn" type="button" title="Fill name, email, phone and message fields">Fill all</button>
        <button id="rescan" class="mini-btn" type="button">Rescan</button>
      </div>
    </div>
    <ul id="form-list" class="form-list" hidden></ul>
    <p id="empty" class="empty" hidden>No Contact Form 7 forms were found on this page.</p>
  </section>

  <footer class="footer">
    <a id="all-forms" class="footer-link" target="_blank" rel="noopener noreferrer">Open CF7 forms list</a>
    <span class="footer-spacer"></span>
    <button id="options-btn" class="link-btn" type="button">Options</button>
  </footer>

  <script src="../shared/settings.js"></script>
  <script src="popup.js"></script>
</body>
</html>
